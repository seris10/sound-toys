<script>
/* ── Robust mobile audio unlock (shared across the sound toys) ──────────
   Phones keep Web Audio silent until a media session is opened by a real
   user gesture, and the iPhone ring/silent switch mutes Web Audio unless a
   media element is playing. This tracks every AudioContext the page creates,
   and on the first touch resumes it, primes it with a one-sample buffer, and
   loops a silent <audio> element so iOS routes Web Audio to the speaker.
   Additive and harmless on desktop / Android. */
(function () {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  var ctxs = [];
  try {
    var P = new Proxy(AC, { construct: function (T, a) {
      var c = Reflect.construct(T, a); ctxs.push(c); return c;
    } });
    window.AudioContext = P;
    if (window.webkitAudioContext) window.webkitAudioContext = P;
  } catch (e) { /* no Proxy: still flip the session below */ }
  function silentWav() {
    var sr = 8000, n = Math.floor(sr * 0.25), bytes = 44 + n * 2;
    var b = new ArrayBuffer(bytes), v = new DataView(b);
    var w = function (o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, bytes - 8, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, n * 2, true);
    var u8 = new Uint8Array(b), bin = '';
    for (var i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
    return 'data:audio/wav;base64,' + btoa(bin);
  }
  var el = null;
  function unlock() {
    try {
      if (!el) {
        el = document.createElement('audio');
        el.setAttribute('playsinline', ''); el.loop = true; el.preload = 'auto';
        el.src = silentWav(); el.style.display = 'none';
        (document.body || document.documentElement).appendChild(el);
      }
      var pr = el.play(); if (pr && pr.catch) pr.catch(function () {});
    } catch (e) {}
    for (var i = 0; i < ctxs.length; i++) {
      var c = ctxs[i];
      try {
        if (c.state === 'suspended') c.resume();
        var buf = c.createBuffer(1, 1, 22050), s = c.createBufferSource();
        s.buffer = buf; s.connect(c.destination); s.start(0);
      } catch (e) {}
    }
  }
  ['touchend', 'touchstart', 'pointerdown', 'mousedown', 'click', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, unlock, true);
  });
})();
</script>
<script>
/* Budgie listener: classifies microphone phrases (contact call, warble,
   chatter, startle) with local Web Audio analysis and answers with budgerigar
   call types. Contact-call replies converge toward the caller's contour.
   Replies wait for the phrase to end, are cancelled if a new phrase starts,
   and listening is gated off while any sound is playing. */
window.createBudgie = function (opts) {
  const ctx = opts.ctx;
  const onVisual = opts.onVisual || (() => {});
  const onStatus = opts.onStatus || (() => {});
  const onLevel = opts.onLevel || (() => {});
  const outAn = opts.outputAnalyser || null;
  const params = { sensitivity: 0.6, chattiness: 0.6, mimicry: 0.5, model: 'research' };

  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const rand = (a, b) => a + Math.random() * (b - a);
  const median = (arr) => { const s = arr.slice().sort((a, b) => a - b); return s.length ? s[s.length >> 1] : 0; };
  const resample = (arr, n) => {
    const out = new Array(n);
    if (!arr.length) return out.fill(0);
    for (let i = 0; i < n; i++) {
      const x = arr.length === 1 ? 0 : i * (arr.length - 1) / (n - 1);
      const a = Math.floor(x), b = Math.min(arr.length - 1, a + 1), t = x - a;
      out[i] = arr[a] * (1 - t) + arr[b] * t;
    }
    return out;
  };
  const nowP = () => performance.now() / 1000;

  const bus = ctx.createGain();
  bus.gain.value = 1;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 6; comp.attack.value = 0.002; comp.release.value = 0.08;
  bus.connect(comp); comp.connect(opts.output);

  const mkWave = (imag) => ctx.createPeriodicWave(new Float32Array(imag.length), new Float32Array(imag));
  const richWave = mkWave([0, 1, 0.6, 0.4, 0.25, 0.15, 0.08, 0.04]);
  const pureWave = mkWave([0, 1, 0.12, 0.04]);
  const noiseBuf = (() => {
    const b = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  })();

  const live = new Set();      // scheduled voices, for cancel
  let timeline = [];           // { t0, t1, curve, amp } for the visualizer
  let reply = null;            // { start, end, label } on the audio clock

  function syllable(t0, s) {
    const dur = Math.max(0.012, s.dur);
    const pts = s.contour.length >= 2 ? s.contour : [s.contour[0], s.contour[0]];
    const curve = new Float32Array(resample(pts, Math.max(8, pts.length)).map(f => clamp(f, 300, 9500)));
    const env = ctx.createGain();
    const att = Math.min(0.006, dur * 0.25), rel = Math.min(0.02, dur * 0.35);
    env.gain.value = 0;
    env.gain.setValueAtTime(0, t0);
    env.gain.linearRampToValueAtTime(s.amp, t0 + att);
    env.gain.setValueAtTime(s.amp, t0 + dur - rel);
    env.gain.linearRampToValueAtTime(0, t0 + dur);
    env.connect(bus);
    const sources = [], others = [env];
    const noise = s.noise || 0;
    if (noise < 0.98) {
      const osc = ctx.createOscillator();
      osc.setPeriodicWave(s.rich === false ? pureWave : richWave);
      osc.frequency.value = curve[0];
      osc.frequency.setValueCurveAtTime(curve, t0, dur);
      const g = ctx.createGain(); g.gain.value = 1 - noise;
      osc.connect(g); g.connect(env); others.push(g);
      if (s.fmDepth) {
        const fm = ctx.createOscillator(), fg = ctx.createGain();
        fm.frequency.value = s.fmRate || 60; fg.gain.value = s.fmDepth;
        fm.connect(fg); fg.connect(osc.frequency); others.push(fg);
        fm.start(t0); fm.stop(t0 + dur + 0.03); sources.push(fm);
      }
      osc.start(t0); osc.stop(t0 + dur + 0.03); sources.push(osc);
    }
    if (noise > 0.02) {
      const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = s.noiseQ || 4;
      bp.frequency.value = curve[0]; bp.frequency.setValueCurveAtTime(curve, t0, dur);
      const g = ctx.createGain(); g.gain.value = noise * 2.2;
      src.connect(bp); bp.connect(g); g.connect(env); others.push(bp, g);
      src.start(t0, Math.random() * 0.9); src.stop(t0 + dur + 0.03); sources.push(src);
    }
    const voice = { env, sources };
    live.add(voice);
    sources[sources.length - 1].onended = () => {
      live.delete(voice);
      sources.concat(others).forEach(n => { try { n.disconnect(); } catch (e) {} });
    };
    timeline.push({ t0, t1: t0 + dur, curve, amp: s.amp });
  }

  function play(seq, delay, label) {
    const start = ctx.currentTime + delay;
    let end = start;
    seq.forEach(el => { (el.research ? syllableR : syllable)(start + el.at, el); end = Math.max(end, start + el.at + el.dur); });
    reply = { start, end, label, announced: false };
  }

  function cancel() {
    const t = ctx.currentTime;
    live.forEach(v => {
      (v.envs || [v.env]).forEach(g => { try { g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0, t, 0.004); } catch (e) {} });
      v.sources.forEach(s => { try { s.stop(t + 0.03); } catch (e) {} });
    });
    timeline = [];
    reply = null;
  }


  /* Research voice model. Parameter values come from these sources:
     [Tu11]  Tu, Osmanski & Dooling 2011, J Acoust Soc Am 129:2289, Table 1: contact calls and
             warble elements of 4 birds (duration, peak frequency, frequency range, FM and AM
             contour rates in Hz).
     [TSD11] Tu, Smith & Dooling 2011, J Comp Psychol: warble element categories A-G.
     [Tob19] Tobin, Medina-Garcia, Kohn & Wright 2019, Behav Processes 163:81, Table 5a/5b:
             first-order transition counts between A-G; Table 1: bout 3.0-3.2 s, 20-26 elements.
     [Man21] Mann, Fitch, Tu & Hoeschele 2021, Sci Rep 11:776: syllables are a noisy initial
             segment (34% periodic, 46.7 dB), periodic medial segments (6.5 ms, F0 2522 Hz,
             56.4 dB) and a final segment (12 ms, F0 2069 Hz, 52.8 dB).
     [Lav99] Lavenex 1999, J Acoust Soc Am 106:491: budgerigar calls carry amplitude modulation,
             the product of two signals, whose sum/difference sidebands look like harmonics.
             The paper's modulator frequency is not in the open abstract; AM_MOD_HZ is an
             assumption, not a measurement.
     [Mad23] Madabhushi et al. 2023, J Exp Biol 226:jeb246252: colony-specific repetition
             patterns disappear after contact (sequence statistics converge).
     [Hil00] Hile, Plummer & Striedter 2000: mates converge on a shared contact call;
     [Zha24] Zhao et al. 2024, Curr Biol: shared call types coexist with individual signatures. */
  const CATS = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
  const TOBIN_FEMALE = [[4,13,11,16,9,2,0],[14,118,42,126,99,17,0],[2,56,64,128,31,17,1],
    [6,163,123,2174,232,137,6],[19,76,30,253,234,66,2],[1,33,16,131,56,56,2],[0,0,1,7,0,3,0]];
  const TOBIN_MALE = [[7,12,1,17,7,5,0],[18,300,96,177,89,25,1],[7,58,60,134,20,2,1],
    [9,221,92,1687,175,107,2],[4,89,14,190,114,31,0],[1,42,6,90,25,48,1],[0,1,1,2,1,0,1]];
  // Pooled counts plus a Dirichlet(0.5) prior so no transition has probability zero.
  const baseCounts = TOBIN_FEMALE.map((r, i) => r.map((c, j) => c + TOBIN_MALE[i][j] + 0.5));
  const heardCounts = CATS.map(() => CATS.map(() => 0));
  const AM_MOD_HZ = [350, 650];        // assumed range of the second signal in [Lav99]
  const gauss = (m, sd) => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random();
    return m + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const gamma2 = (mean) => -(mean / 2) * Math.log(Math.random() * Math.random() + 1e-12);

  const rowNorm = (r) => { const t = r.reduce((a, b) => a + b, 0); return r.map(x => x / t); };
  // Convergence [Mad23]: each row mixes toward the transitions heard from the partner,
  // weighted by how much evidence that row has, n/(n+8), scaled by the Mimicry setting.
  function transitionMatrix() {
    return baseCounts.map((r, i) => {
      const pb = rowNorm(r), n = heardCounts[i].reduce((a, b) => a + b, 0);
      if (!n) return pb;
      const ph = rowNorm(heardCounts[i]), lam = 0.7 * params.mimicry * n / (n + 8);
      return pb.map((x, j) => (1 - lam) * x + lam * ph[j]);
    });
  }
  function stationary(P) {
    let pi = CATS.map(() => 1 / CATS.length);
    for (let k = 0; k < 200; k++) pi = CATS.map((_, j) => pi.reduce((a, p, i) => a + p * P[i][j], 0));
    return pi;
  }
  // Conditional Shannon entropy H(S[n+1] | S[n]) in bits.
  function condEntropy(P, pi) {
    let h = 0;
    for (let i = 0; i < P.length; i++) for (let j = 0; j < P.length; j++) if (P[i][j] > 0) h -= pi[i] * P[i][j] * Math.log2(P[i][j]);
    return h;
  }
  function heardEntropy() {
    const n = heardCounts.flat().reduce((a, b) => a + b, 0);
    if (n < 6) return null;
    const rows = heardCounts.map(r => r.reduce((a, b) => a + b, 0));
    let h = 0;
    heardCounts.forEach((r, i) => r.forEach(c => { if (c) h -= (c / n) * Math.log2(c / rows[i]); }));
    return h;
  }
  const sampleIdx = (probs) => { let r = Math.random(), i = 0; for (; i < probs.length - 1; i++) { r -= probs[i]; if (r <= 0) break; } return i; };

  // Individual contact call [Tu11]: per-bird means fall in these ranges.
  const indiv = {
    fc: rand(2800, 3000), range: rand(1830, 2450), dur: rand(0.129, 0.190),
    fmHz: rand(7.5, 8.6), fmPhase: rand(0, 2 * Math.PI), amHz: rand(3.0, 5.1), amPhase: rand(0, 2 * Math.PI),
    amMod: rand(AM_MOD_HZ[0], AM_MOD_HZ[1]),
  };
  // Signature contour in octaves relative to fc: individual shape plus a shared part
  // learned from the partner. share approaches 0.75, never 1, so identity survives [Zha24].
  const indivShape = Array.from({ length: 24 }, (_, i) =>
    (indiv.range / 2 / indiv.fc) * Math.sin(2 * Math.PI * indiv.fmHz * indiv.dur * i / 23 + indiv.fmPhase));
  let sharedShape = indivShape.slice(), share = 0;

  // Envelope curve: raised-cosine onset/offset, per-segment gains, contour AM.
  function envCurve(dur, peak, amHz, amDepth, amPhase, segGains) {
    const N = 64, out = new Float32Array(N), atk = Math.min(0.004, dur * 0.3), rel = Math.min(0.008, dur * 0.4);
    for (let i = 0; i < N; i++) {
      const t = dur * i / (N - 1);
      let w = 1;
      if (t < atk) w = 0.5 - 0.5 * Math.cos(Math.PI * t / atk);
      else if (t > dur - rel) w = 0.5 - 0.5 * Math.cos(Math.PI * (dur - t) / rel);
      const seg = segGains ? segGains(t / dur) : 1;
      const am = 1 - amDepth + amDepth * (0.5 + 0.5 * Math.cos(2 * Math.PI * amHz * t + amPhase));
      out[i] = Math.max(0, peak * w * seg * am);
    }
    out[0] = 0; out[N - 1] = 0;
    return out;
  }
  const dB = (x) => Math.pow(10, x / 20);
  // [Man21] segment gains relative to the medial segment: initial -9.7 dB, final -3.6 dB.
  const manSegments = (fracInit, fracFinal) => (u) => u < fracInit ? dB(-9.7) : u > 1 - fracFinal ? dB(-3.6) : 1;

  // x(t) = A(t) [1 + m cos(2 pi fm t)] sin(2 pi integral f) / (1 + m), plus band-limited noise
  // with its own envelope for consonant-like segments.
  // Makeup gain so the research voice sits at the same loudness as Classic (measured -4 dB).
  const rBus = ctx.createGain(); rBus.gain.value = dB(4); rBus.connect(bus);
  function syllableR(t0, s) {
    const dur = Math.max(0.003, s.dur);
    const curve = new Float32Array(resample(s.contour.length >= 2 ? s.contour : [s.contour[0], s.contour[0]], 32).map(f => clamp(f, 300, 9500)));
    const sources = [], others = [], envs = [];
    if (s.tonal) {
      const osc = ctx.createOscillator(); osc.type = 'sine';
      osc.frequency.value = curve[0]; osc.frequency.setValueCurveAtTime(curve, t0, dur);
      const am = ctx.createGain(), m = s.amIndex || 0;
      am.gain.value = 1 / (1 + m);
      if (m > 0) {
        const mod = ctx.createOscillator(), mg = ctx.createGain();
        mod.frequency.value = s.amMod; mg.gain.value = m / (1 + m);
        mod.connect(mg); mg.connect(am.gain); mod.start(t0); mod.stop(t0 + dur + 0.02);
        sources.push(mod); others.push(mg);
      }
      const env = ctx.createGain(); env.gain.value = 0; env.gain.setValueCurveAtTime(s.tonal, t0, dur);
      osc.connect(am); am.connect(env); env.connect(rBus);
      osc.start(t0); osc.stop(t0 + dur + 0.02); sources.push(osc); others.push(am, env); envs.push(env);
    }
    if (s.noisy) {
      const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = s.noiseQ || 1;
      bp.frequency.value = s.noiseHz || curve[0];

    if (reply && at > reply.end + 0.25) { reply = null; lastActivityP = tP; onStatus(lastStatus, { match, arousal, replying: null }); }

    if (an && ctx.state === 'running') {
      an.getFloatTimeDomainData(td); an.getFloatFrequencyData(fd);
      let s = 0; for (let i = 0; i < td.length; i++) s += td[i] * td[i];
      const db = 20 * Math.log10(Math.sqrt(s / td.length) + 1e-9);
      // Noise floor: falls fast, rises slowly, and keeps rising during a phrase
      // so a steady room sound cannot hold a phrase open.
      if (tP < calibrateUntil) floor += (db - floor) * 0.3;
      else if (!busy) floor += (db - floor) * (db < floor ? 0.2 : phrase ? 0.004 : 0.01);
      floor = clamp(floor, -85, -20);
      const onT = Math.max(-75, floor + (20 - 12 * params.sensitivity)), offT = onT - 4;
      onLevel({ db, floor, on: onT, busy });

      const loudNow = !busy && db > offT;
      if (!phrase && !busy && tP >= calibrateUntil && db > onT) {
        // A new phrase before the reply starts cancels the reply.
        if (reply && at < reply.start) { cancel(); status('You kept going, so it waits.'); }
        phrase = { t0: tP, lastLoud: tP, frames: [], syl: 0, inSyl: false, peakDb: db, minDb: db, sylls: [] };
        status('Hearing you…');
      }
      if (phrase) {
        if (loudNow) {
          const pf = framePitch(ctx.sampleRate);
          phrase.frames.push(pf);
          phrase.lastLoud = tP;
          phrase.peakDb = Math.max(phrase.peakDb, db);
          phrase.minDb = Math.min(phrase.minDb, db);
          // Syllable boundaries: a gap, an amplitude valley (8 dB under the syllable peak, then
          // a 4 dB rise), or a pitch jump over 4 semitones, after the cues in [Man21].
          let cs = phrase.sylls[phrase.sylls.length - 1];
          if (phrase.inSyl && cs) {
            const last = cs.frames[cs.frames.length - 1];
            if (db < cs.peak - 8) cs.dipped = true;
            const valley = cs.dipped && db > last.db + 4;
            const jump = pf.prominence > 12 && last.prominence > 12 && Math.abs(12 * Math.log2(pf.f / last.f)) > 4;
            if (valley || jump) phrase.inSyl = false;
          }
          if (!phrase.inSyl) { phrase.syl++; phrase.inSyl = true; phrase.sylls.push({ t0: tP, t1: tP, frames: [], peak: db, dipped: false }); }
          cs = phrase.sylls[phrase.sylls.length - 1]; cs.t1 = tP; cs.frames.push(Object.assign({ db }, pf));
          if (db > cs.peak) { cs.peak = db; cs.dipped = false; }
          if (pf.prominence > 12) hearF = pf.f;
        } else if (phrase.inSyl && tP - phrase.lastLoud > 0.03) phrase.inSyl = false;
        if (tP - phrase.lastLoud > 0.35 || tP - phrase.t0 > 12 || busy) {
          const p = phrase; phrase = null;
          if (p.frames.length) finishPhrase(p);
        }
      }

      if (!phrase && !busy && !reply && tP > nextSpontP && spontCount < 3 && params.chattiness > 0.05 && tP > quietUntil) {
        spontCount++;
        lastCallP = tP;
        play([params.model === 'research' ? contactR(0) : contactEl(0, 0.3)], 0.02, 'Calling out to you');
        status(spontCount === 1 ? 'Quiet for a while, so it calls out.' : 'Still calling. Answer it with a chirp.');
        nextSpontP = tP + rand(10, 25) / (0.4 + params.chattiness);
      }
    }

    // Visualizer input: the bird's voice takes priority over the heard phrase.
    timeline = timeline.filter(e => e.t1 > at - 0.05);
    const cur = timeline.find(e => at >= e.t0 && at < e.t1);
    if (cur) {
      const x = (at - cur.t0) / (cur.t1 - cur.t0) * (cur.curve.length - 1);
      const i = Math.floor(x), j = Math.min(cur.curve.length - 1, i + 1);
      onVisual(cur.curve[i] + (cur.curve[j] - cur.curve[i]) * (x - i), clamp(cur.amp * 4.5, 0.2, 1), 'voice');
    } else if (phrase && hearF) {
      onVisual(hearF, 0.35, 'hear');
    } else {
      onVisual(null, 0, null);
    }
  }

  const timer = setInterval(tick, 20);

  return {
    startListening,
    stopListening,
    cancel,
    setParams: (p) => Object.assign(params, p),
    info: () => researchInfo(),
    // Play a full warble bout without listening (used by the Parakeet melody button).
    performWarble() {
      const total = params.model === 'research' ? clamp(gauss(3.1, 0.6), 1.8, 5) : rand(2.5, 4);
      const seq = params.model === 'research' ? warbleR(total) : warble(total);
      play(seq, 0.05, 'Warbling');
      return reply.end - ctx.currentTime;
    },
    get listening() { return !!stream; },
    destroy() { clearInterval(timer); cancel(); stopListening(); try { rBus.disconnect(); bus.disconnect(); comp.disconnect(); } catch (e) {} },
  };
};

            const clientX = e.clientX ?? (e.touches?.[0]?.clientX ?? 0);
            const clientY = e.clientY ?? (e.touches?.[0]?.clientY ?? 0);
            const x = Math.max(0, Math.min(255, Math.round((clientX - rect.left) / rect.width * 256)));
            const y = 1 - 2 * Math.max(0, Math.min(1, (clientY - rect.top) / rect.height)); // -1 to 1
            return { x, y };

            const ctx = cvs.getContext('2d');

            osc.type = waveTypeRef.current;
            osc.frequency.value = 220;

            filter.type = filterTypeRef.current;
            filter.frequency.value = filterCutoffRef.current;

          useEffect(() => {

          // Apply harmonics as PeriodicWave

            if (!oscillatorRef.current || !audioCtxRef.current) return;
            const real = new Float32Array(h.length + 1);
            const imag = new Float32Array(h.length + 1);
            real[0] = 0; imag[0] = 0;
            for (let i = 0; i < h.length; i++) {
              real[i + 1] = 0;
              imag[i + 1] = h[i]; // sine components
            }
            const wave = audioCtxRef.current.createPeriodicWave(real, imag, { disableNormalization: false });
            oscillatorRef.current.setPeriodicWave(wave);
          }, []);

          useEffect(() => {

            if (waveSourceRef.current === 'harmonics') {

          // Apply drawn waveform via FFT decomposition into PeriodicWave

            if (!oscillatorRef.current || !audioCtxRef.current || !samples) return;
            // Simple DFT to extract harmonics from drawn wave (up to 32 partials)
            const N = samples.length;
            const numPartials = 32;
            const real = new Float32Array(numPartials + 1);
            const imag = new Float32Array(numPartials + 1);
            real[0] = 0; imag[0] = 0;
            for (let k = 1; k <= numPartials; k++) {
              let re = 0, im = 0;
              for (let n = 0; n < N; n++) {
                const angle = (2 * Math.PI * k * n) / N;
                re += samples[n] * Math.cos(angle);
                im -= samples[n] * Math.sin(angle);
              }
              real[k] = (re / N) * 2;
              imag[k] = (im / N) * 2;

          const triggerNote = (freq, amp) => {
            const MAX_SAFE_GAIN = 0.25;

              else if (f < 4000) zone = 'contact call';
              else if (f < 6000) zone = 'excited';

                filterRef.current.frequency.setTargetAtTime(

                );

              const env = adsrRef.current;
              const peak = amp * MAX_SAFE_GAIN;
              const sustainLevel = peak * env.s;

              if (amp > 0.001) {
                // Note ON: Attack > Decay > Sustain
                adsrGainRef.current.gain.cancelScheduledValues(now);
                adsrGainRef.current.gain.setValueAtTime(adsrGainRef.current.gain.value, now);
                adsrGainRef.current.gain.linearRampToValueAtTime(peak, now + env.a);
                adsrGainRef.current.gain.linearRampToValueAtTime(sustainLevel, now + env.a + env.d);
              } else {
                // Note OFF: Release
                adsrGainRef.current.gain.cancelScheduledValues(now);
                adsrGainRef.current.gain.setValueAtTime(adsrGainRef.current.gain.value, now);
                adsrGainRef.current.gain.linearRampToValueAtTime(0, now + env.r);

            }

          useEffect(() => {
            const keyMap = {
              KeyZ: 261.63, KeyS: 277.18, KeyX: 293.66, KeyD: 311.13,
              KeyC: 329.63, KeyV: 349.23, KeyG: 369.99, KeyB: 392.00,
              KeyH: 415.30, KeyN: 440.00, KeyJ: 466.16, KeyM: 493.88,
              Comma: 523.25,
            };
            const held = new Set();
            const onDown = (e) => {
              if (e.repeat) return;
              const freq = keyMap[e.code];
              if (!freq) return;
              if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;

              triggerNote(freq, 0.7);
              setIsInteracting(true);
              isInteractingRef.current = true;

            const onUp = (e) => {

                setIsInteracting(false);
                isInteractingRef.current = false;
              }
            };

            window.addEventListener('keyup', onUp);
            return () => {
              window.removeEventListener('keydown', onDown);

            };

              fmRate: 8 + Math.random() * 6,

            });

              contactChirpDown, shortHarmonic, shortHarmonic,
              silence,

          const handlePointerDown = async (e) => {
            pointerDownRef.current = true;

                                        const clientY = ev.clientY || (ev.touches && ev.touches[0].clientY) || 0;

                                          const next = [...prev];
                                          next[i] = parseFloat(y.toFixed(2));
                                          return next;
                                        });
                                        setWaveSource('harmonics');
                                      };
                                      setVal(e);
                                      const onMove = (ev) => { ev.preventDefault(); setVal(ev); };
                                      const onUp = () => { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); };
                                      window.addEventListener('pointermove', onMove);
                                      window.addEventListener('pointerup', onUp);
                                    }}
                                  >
                                    <div className="harmonic-bar-fill" style={{ height: `${val * 100}%` }} />

                                </div>

                                className="flex-1 text-[9px] text-slate-500 hover:text-slate-300 border border-slate-800 rounded-md py-1 transition-colors"

                        <div className="h-px bg-slate-800/40" />

                              <div className="param-row">
                                <span className="param-label">Decay</span>
                                <input type="range" min="0.001" max="1" step="0.001" value={adsr.d}

                                <span className="param-value">{(adsr.r * 1000).toFixed(0)}ms</span>
                              </div>
                            </div>

                        <div className="h-px bg-slate-800/40" />

                            <div>
                              <div className="panel-section-label">Filter type</div>

                        <div className="h-px bg-slate-800/40" />

                        {/* Reset all */}

                              setWaveType('sine');

                              const defaultH = new Array(16).fill(0); defaultH[0] = 1;
                              setHarmonics(defaultH);
                              setDrawnWave(null);
                              setAdsr({ a: 0.01, d: 0.1, s: 0.7, r: 0.15 });
                              setFilterType('lowpass');
                              setFilterCutoff(4000);
                              setLfoRate(0);
                              setLfoDepth(0);
                              setLfoTarget('pitch');
                              colorHistoryRef.current = [{ h: 0, s: 40, l: 15, dom: 1, phase: 0 }];
                              lastRecordedFreqRef.current = 220;
                              colorAccumRef.current = 0;
                              ringColorsRef.current = [
                                { h: 0, s: 40, l: 15 }, { h: 0, s: 40, l: 15 },
                                { h: 0, s: 40, l: 15 }, { h: 0, s: 40, l: 15 }
                              ];
                              ringColors2Ref.current = [
                                { h: 0, s: 40, l: 15 }, { h: 0, s: 40, l: 15 },
                                { h: 0, s: 40, l: 15 }, { h: 0, s: 40, l: 15 }

                              const cvs = drawCanvasRef.current;
                              if (cvs) {

                                ctx.clearRect(0, 0, cvs.width, cvs.height);

                                ctx.beginPath();
                                ctx.moveTo(0, cvs.height / 2);

                <div className="hidden md:flex">
                  <div className="px-8 py-4 border-b-2 border-cyan-500 text-cyan-400">Experience</div>
                  <div className="px-8 py-4 text-slate-600 cursor-not-allowed">Learn</div>

                <div className="flex items-center px-4 py-2 md:py-0 border-t md:border-t-0 border-slate-800/80 overflow-x-auto">

                        parakeetMode
                        ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50'
                        : 'bg-slate-800/50 text-slate-400 border border-slate-700 hover:bg-slate-800 hover:text-slate-300'
                      }`}
                    >
                      {'\u{1F426}'} Parakeet
                    </button>

                    <div className="w-px h-5 bg-slate-800 self-center" />
                    {Object.entries(MELODIES).map(([key, melody]) => (
                      <button
                        key={key}
                        onClick={() => { if (parakeetMode) return; if (activeMelody === key) { stopMelody(); } else if (key === 'parakeet') { playParakeetChatter(); } else { playMelody(key); } }}
                        disabled={parakeetMode}
                        className={`flex items-center gap-1.5 px-4 py-2 md:py-1.5 rounded-full text-xs font-bold transition-all ${
                          activeMelody === key
                          ? key === 'parakeet'
                            ? 'bg-green-500/20 text-green-400 border border-green-500/50'
                            : 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/50'
                          : key === 'parakeet'
                            ? 'bg-emerald-900/30 text-emerald-400 border border-emerald-700 hover:bg-emerald-800/40 hover:text-emerald-300'
                            : `bg-slate-800/50 border border-slate-700 ${parakeetMode ? 'text-slate-700 cursor-not-allowed' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-300'}`
                        }`}
                      >
                        {activeMelody === key ? <IconSquare size={10} /> : <IconPlay size={10} />}
                        {melody.name}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* Main Interactive Area */}
              <div className="flex-1 flex w-full select-none group overflow-hidden relative">
                {/* Visualization region - fills remaining space */}
                <div className="flex-1 relative h-full min-w-0">
                
                <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.01)_0%,transparent_70%)] pointer-events-none" />

                <div 
                  ref={containerRef}
                  className="absolute inset-0 w-full h-full touch-none"

                    className="w-full h-full cursor-crosshair"
                    onPointerDown={handlePointerDown}
                    onPointerMove={handlePointerMove}
                    onPointerUp={handlePointerUp}
                    onPointerLeave={handlePointerUp}
                  />
                </div>

                {/* TOP OVERLAY: Frequency markers */}
                {!parakeetMode && (
                  <div className={`absolute top-0 left-0 right-0 h-16 pointer-events-none transition-opacity duration-1000 ${hasStarted ? 'opacity-100' : 'opacity-0'}`}>
                    {MUSICAL_NOTES.map((note) => {
                      const isNatural = !note.n.includes('#');
                      return (
                        <div
                          key={note.n}
                          className="absolute top-0 flex flex-col items-center pointer-events-auto cursor-pointer"
                          style={{ left: `${getXPercentForFreq(note.f)}%`, transform: 'translateX(-50%)' }}
                          onPointerDown={async (e) => {
                            e.stopPropagation();
                            if (!hasStarted) { setHasStarted(true); try { await initAudio(); } catch(err) { console.error('[audio-diag] note initAudio FAILED:', err); } }
                            if (audioCtxRef.current?.state === 'suspended') await audioCtxRef.current.resume();
                            if (isPlayingMelodyRef.current) stopMelody();
                            triggerNote(note.f, 0.95);
                            setIsInteracting(true);
                            isInteractingRef.current = true;
                          }}
                          onPointerUp={(e) => {
                            e.stopPropagation();
                            handlePointerUp();
                          }}
                          onPointerLeave={handlePointerUp}
                        >
                          <div className={`w-px bg-cyan-500/30 transition-all ${isNatural ? 'h-6' : 'h-3'}`}></div>

                            {note.n}
                          </span>
                        </div>
                      );
                    })}

                      { label: 'Chatter', freq: 1500, color: 'text-yellow-500/50' },
                      { label: 'Contact call', freq: 3000, color: 'text-emerald-500/50' },
                      { label: 'Excited', freq: 5000, color: 'text-cyan-500/50' },
                      { label: 'Alarm', freq: 7500, color: 'text-rose-500/50' },
                    ].map((zone) => (
                      <div
                        key={zone.label}
                        className="absolute top-0 flex flex-col items-center pointer-events-auto cursor-pointer"
                        style={{ left: `${getXPercentForFreq(zone.freq)}%`, transform: 'translateX(-50%)' }}
                        onPointerDown={async (e) => {
                          e.stopPropagation();
                          if (!hasStarted) { setHasStarted(true); try { await initAudio(); } catch(err) { console.error('[audio-diag] parakeet initAudio FAILED:', err); } }
                          if (audioCtxRef.current?.state === 'suspended') await audioCtxRef.current.resume();
                          triggerNote(zone.freq, 0.85);
                          setIsInteracting(true);
                          isInteractingRef.current = true;
                        }}
                        onPointerUp={(e) => {
                          e.stopPropagation();
                          handlePointerUp();
                        }}
                        onPointerLeave={handlePointerUp}
                      >

                        <span className={`text-[9px] mt-1 font-mono tracking-tight ${zone.color} hover:text-emerald-400 transition-colors whitespace-nowrap`}>
                          {zone.label}
                        </span>
                      </div>
                    ))}
                  </div>
                )}

                {parakeetMode && (
                  <button
                    onPointerDown={(e) => e.stopPropagation()}
                    onClick={() => pkListening ? stopBudgie() : startBudgie()}

                    title={pkListening ? 'Stop listening' : 'Listen through the microphone'}
                  >
                    <span className={`inline-block w-2 h-2 rounded-full shrink-0 ${pkListening ? (pkReplying ? 'bg-amber-400' : 'bg-emerald-400 animate-pulse') : 'bg-slate-600'}`} />
                    <span className="truncate">{pkListening ? (pkReplying || pkStatus || 'Listening') : (pkStatus || 'Listen: off. Tap to let it hear you')}</span>
                  </button>

                {/* SYNTH PANEL - Desktop: sidebar, Mobile: bottom drawer */}

                  <button
                    onClick={() => setPanelOpen(p => !p)}
                    className="w-full py-2 flex items-center justify-center text-slate-600 hover:text-cyan-400 transition-colors shrink-0 border-b border-slate-800/30"
                    style={{ fontSize: '12px' }}
                  >
                    {panelOpen ? '\u25B6 Hide' : '\u25C0'}
                  </button>

                  {panelOpen && (
                    <div className="flex flex-col h-full bg-black/90 border border-slate-800/50 rounded-2xl backdrop-blur-md shadow-2xl overflow-hidden">
                      <div className="flex-1 panel-scroll p-3 flex flex-col gap-5">
                        {panelContent}
                      </div>
                    </div>
                  )}
                </div>

                {/* Mobile drawer tab (visible on mobile only, when drawer is closed) */}
                {hasStarted && !panelOpen && (
                  <div
                    className="md:hidden synth-drawer-tab bg-slate-900 border border-slate-800/60 border-b-0 text-slate-400 active:text-cyan-400"
                    onClick={() => setPanelOpen(true)}
                  >
                    Settings
                  </div>
                )}

                {/* Mobile backdrop (visible when drawer is open) */}
                {panelOpen && (
                  <div
                    className="md:hidden synth-drawer-backdrop"
                    onClick={() => setPanelOpen(false)}
                  />
                )}

                {/* Mobile drawer (slides up from bottom) */}
                <div className={`md:hidden synth-drawer bg-black/95 border-t border-slate-800/50 backdrop-blur-xl ${hasStarted ? '' : 'pointer-events-none'} ${panelOpen ? 'open' : 'closed'}`}>

                  <div
                    className="flex flex-col items-center pt-2 pb-1 cursor-pointer touch-none"
                    onClick={() => setPanelOpen(false)}
                    onTouchStart={(e) => {
                      const startY = e.touches[0].clientY;
                      const drawer = e.currentTarget.parentElement;
                      let currentDelta = 0;

                      const onMove = (ev) => {
                        const delta = ev.touches[0].clientY - startY;
                        if (delta > 0) {
                          currentDelta = delta;
                          drawer.style.transform = `translateY(${delta}px)`;
                          drawer.style.transition = 'none';
                        }
                      };

                      const onEnd = () => {
                        drawer.style.transition = '';
                        if (currentDelta > 80) {
                          setPanelOpen(false);
                        }
                        drawer.style.transform = '';
                        window.removeEventListener('touchmove', onMove);
                        window.removeEventListener('touchend', onEnd);
                      };

                      window.addEventListener('touchmove', onMove, { passive: false });
                      window.addEventListener('touchend', onEnd);
                    }}
                  >
                    <div className="w-10 h-1 rounded-full bg-slate-700 mb-1"></div>
                    <span className="text-[10px] text-slate-600">drag or tap to close</span>
                  </div>

                  {/* All settings - MOBILE */}
                  <div className="panel-scroll p-4 flex flex-col gap-5" style={{ maxHeight: 'calc(75vh - 40px)', overflowY: 'auto' }}>
                    {panelContent}
                  </div>

                  <div className="flex items-center gap-6 md:gap-8 bg-black/80 p-5 md:p-6 rounded-2xl border border-slate-800/50 backdrop-blur-md shadow-2xl">
                    <div>
                      <p className="text-[10px] md:text-xs text-cyan-500/80 uppercase tracking-widest font-bold mb-1.5">Frequency</p>
                      <div className="text-3xl md:text-4xl font-light text-white">
                        <span ref={freqDisplayRef}>220</span> <span className="text-base text-slate-500 font-medium">Hz</span>
                      </div>
                      {parakeetMode && (
                        <div className="text-[10px] text-emerald-500/60 font-mono mt-0.5" ref={pkZoneLabelRef}></div>
                      )}
                    </div>
                    <div className="h-14 w-px bg-slate-800"></div>
                    <div>
                      <p className="text-[10px] md:text-xs text-cyan-500/80 uppercase tracking-widest font-bold mb-1.5">Amplitude</p>
                      <div className="text-3xl md:text-4xl font-light text-white">
                        <span ref={ampDisplayRef}>0</span> <span className="text-base text-slate-500 font-medium">%</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Axis Labels */}
                <div className="hidden sm:block absolute left-6 top-1/2 -translate-y-1/2 -rotate-90 text-[10px] font-bold text-slate-700 uppercase tracking-[0.2em] pointer-events-none origin-center">
                  {parakeetMode ? 'Low warble' : 'Deeper Pitch'}
                </div>
              </div>

            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
